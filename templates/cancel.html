<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Payment Cancelled — PayWatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f1117; color: #e8eaf0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1d27; border: 1px solid #2e3347; border-radius: 16px;
            padding: 48px 40px; text-align: center; max-width: 380px; }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; font-weight: 700; color: #ffc344; margin-bottom: 8px; }
    p { color: #8b8fa8; font-size: 0.88rem; margin-bottom: 28px; line-height: 1.6; }
    .btns { display: flex; gap: 12px; justify-content: center; }
    a { display: inline-block; padding: 12px 20px; border-radius: 8px;
        text-decoration: none; font-weight: 600; font-size: 0.88rem; }
    .primary { background: #635bff; color: #fff; }
    .secondary { background: #242736; color: #8b8fa8; border: 1px solid #2e3347; }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Payment Cancelled</h1>
    <p>The checkout was cancelled. No payment was taken. You can try again or return to the dashboard.</p>
    <div class="btns">
      <a class="primary" href="/checkout">Try Again</a>
      <a class="secondary" href="/dashboard">Dashboard</a>
    </div>
  </div>
</body>
</html>
